name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto ZIP si se subió comprimido
        run: |
          if [ ! -f package.json ]; then
            ZIP_FILE=$(find . -maxdepth 3 -type f -name '*.zip' | head -n 1 || true)
            if [ -n "$ZIP_FILE" ]; then
              echo "Descomprimiendo $ZIP_FILE..."
              unzip -o "$ZIP_FILE" || python3 -m zipfile -e "$ZIP_FILE" .
            fi
          fi
          if [ ! -f package.json ]; then
            SUB_PKG=$(find . -maxdepth 3 -type f -name 'package.json' | head -n 1 || true)
            if [ -n "$SUB_PKG" ]; then
              SUB_DIR=$(dirname "$SUB_PKG")
              cp -r "$SUB_DIR"/. .
            fi
          fi
          if [ ! -f package.json ]; then
            echo "ERROR: No se encontró el .zip del proyecto ni package.json en tu repositorio."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Instalar dependencias y preparar proyecto Android
        run: |
          npm install
          if [ ! -f dist/index.html ]; then
            mkdir -p dist
            printf '<!doctype html><html><body><h1>Editor Movil</h1></body></html>' > dist/index.html
          fi
          if [ -f capacitor.config.ts ]; then
            node -e "const fs=require('fs');const s=fs.readFileSync('capacitor.config.ts','utf8');const g=(k,d)=>(s.match(new RegExp(k+':\\s*[\\x27\\x22]([^\\x27\\x22]+)[\\x27\\x22]'))||[])[1]||d;const u=g('url','');fs.writeFileSync('capacitor.config.json',JSON.stringify({appId:g('appId','com.jafet.editormovil'),appName:g('appName','Editor Movil'),webDir:'dist',server:u?{androidScheme:'https',url:u,cleartext:false}:{androidScheme:'https'},plugins:{PushNotifications:{presentationOptions:['badge','sound','alert']}}},null,2));fs.unlinkSync('capacitor.config.ts');"
          fi
          if [ ! -f android/gradlew ]; then
            if [ -d android ]; then
              mv android android-overrides
            fi
            npx cap add android
            if [ -d android-overrides ]; then
              rm -f android-overrides/app/build.gradle android-overrides/variables.gradle
              cp -r android-overrides/. android/
              rm -rf android-overrides
            fi
          fi
          npx cap sync android
      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Subir APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: editor-movil-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
